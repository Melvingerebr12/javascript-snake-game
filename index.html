<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JavaScript Snake Game</title>
  <link rel="stylesheet" href="app.css?v=2" />
</head>

<body>
  Speed: <input type="number" id="gameSpeed" value="5" min="1" max="9" step="1" />
  <input type="button" value="Start" id="gameStart" />
  <canvas id="gameArea"></canvas>
  <div class="direction-pad" role="group" aria-label="Snake direction controls">
    <button type="button" class="direction-button direction-up" data-direction="up" aria-label="Move up">&#8593;</button>
    <button type="button" class="direction-button direction-left" data-direction="left" aria-label="Move left">&#8592;</button>
    <button type="button" class="direction-button direction-right" data-direction="right" aria-label="Move right">&#8594;</button>
    <button type="button" class="direction-button direction-down" data-direction="down" aria-label="Move down">&#8595;</button>
  </div>
  
  <script src="app.js?v=2"></script>
</body>

</html>
